services:
  - type: web
    name: sehat-setu
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SEHATSETU_DB_PATH
        value: /var/data/sehatsetu.sqlite3
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    disk:
      name: sehat-setu-data
      mountPath: /var/data
      sizeGB: 1
